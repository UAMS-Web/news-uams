# Parses every shipped PHP file with the supported floor, PHP 8.2.
name: Lint floor

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-floor:
    name: lint-floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Parse every shipped PHP file on PHP 8.2
        run: |
          set -o pipefail
          count=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || exit 1
            count=$((count + 1))
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -not -path './.git/*' -print0)
          echo "linted $count files"
          [ "$count" -gt 0 ]
